<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="#main" style="position:absolute;left:-9999px;top:8px;z-index:100;background:#CBF24C;color:#0E1110;padding:10px 16px;border-radius:300px;font-weight:700;font-size:14px" style-focus="left:16px">Skip to content</a>
<header data-screen-label="Navigation" style="position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px clamp(16px,2.2vw,32px);background:{{ headerBg }};border-bottom:1px solid {{ headerLine }};transition:background .4s, border-color .4s;font-family:'Satoshi','Helvetica Neue',Helvetica,Arial,sans-serif;color:#0E1110">
  <div style="display:flex;align-items:center;gap:clamp(24px,7vw,106px)">
    <a href="SK Energy Homepage.dc.html" aria-label="SK Energy home" style="display:flex;align-items:center">
      <span style="position:relative;display:block;height:28px"><img src="./assets/sk-logo-ink.svg" alt="SK Energy" style="height:28px;width:auto;display:block;opacity:{{ logoColorOp }};transition:opacity .4s"><img src="./assets/sk-logo-dark.svg" alt="" aria-hidden="true" style="position:absolute;left:0;top:0;height:28px;width:auto;display:block;opacity:{{ logoInkOp }};transition:opacity .4s"></span>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Primary" style="display:flex;align-items:center;gap:32px;font-size:14px;font-weight:700;letter-spacing:-0.02em">
        <div style="position:relative" onMouseEnter="{{ openSvc }}" onMouseLeave="{{ closeSvc }}">
          <button type="button" aria-expanded="{{ svcMenuExpanded }}" aria-controls="svc-menu" onClick="{{ toggleSvc }}" style="display:flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;font-size:14px;font-weight:700;letter-spacing:-0.02em;color:#0E1110;cursor:pointer;border-bottom:2px solid {{ svcLine }}">Services <span aria-hidden="true" style="display:inline-block;font-size:10px;transition:transform .3s;transform:{{ svcCaret }}">▼</span></button>
          <sc-if value="{{ svcMenuOpen }}" hint-placeholder-val="{{ false }}">
            <div id="svc-menu" style="position:absolute;top:100%;left:-24px;padding-top:12px;width:340px">
              <ul style="list-style:none;margin:0;padding:10px;background:#FFFFFF;border:1px solid #E8E8E5;border-radius:20px;box-shadow:0 24px 60px -20px rgba(14,17,16,.25);display:grid;grid-template-columns:1fr;gap:2px">
                <sc-for list="{{ services }}" as="s" hint-placeholder-count="8">
                  <li><a href="{{ s.href }}" style="display:grid;gap:4px;padding:12px 14px;border-radius:12px;transition:background .2s" style-hover="background:#E8E8E5"><span style="font-size:15px;color:#0E1110">{{ s.title }}</span><span style="font-size:13px;font-weight:500;color:#6C7566;line-height:1.35">{{ s.short }}</span></a></li>
                </sc-for>
              </ul>
            </div>
          </sc-if>
        </div>
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
          <a href="{{ l.href }}" aria-current="{{ l.current }}" style="padding:8px 0;border-bottom:2px solid {{ l.line }}" style-hover="opacity:.6">{{ l.label }}</a>
        </sc-for>
      </nav>
    </sc-if>
  </div>
  <div style="display:flex;align-items:center;gap:16px">
    <a href="Contact.dc.html" style="display:flex;align-items:center;gap:16px;height:44px;padding:4px 4px 4px 24px;border-radius:300px;background:{{ ctaBg }};color:{{ ctaFg }};font-size:14px;font-weight:700;letter-spacing:-0.02em;white-space:nowrap;transition:background .4s,color .4s" style-hover="transform:translateY(-1px)">
      <span>{{ ctaLabel }}</span>
      <span aria-hidden="true" style="width:36px;height:36px;border-radius:300px;background:{{ ctaDot }};display:grid;place-items:center;position:relative">
        <span style="position:absolute;width:12px;height:1.5px;background:{{ ctaDotFg }}"></span>
        <span style="position:absolute;width:1.5px;height:12px;background:{{ ctaDotFg }}"></span>
      </span>
    </a>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button type="button" aria-label="Menu" aria-expanded="{{ mobileExpanded }}" aria-controls="mobile-menu" onClick="{{ toggleMobile }}" style="width:44px;height:44px;border-radius:80px;background:#FFFFFF;border:1px solid #E8E8E5;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 11px;cursor:pointer">
        <span style="height:1.5px;background:#0E1110;display:block"></span>
        <span style="height:1.5px;background:#0E1110;display:block"></span>
        <span style="height:1.5px;background:#0E1110;display:block"></span>
      </button>
    </sc-if>
  </div>
</header>
<sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
  <div id="mobile-menu" data-lenis-prevent="" style="position:fixed;inset:84px 0 0 0;z-index:49;background:#F1F1EF;overflow:auto;padding:24px 16px 40px;display:grid;align-content:start;gap:8px;font-family:'Satoshi','Helvetica Neue',Helvetica,Arial,sans-serif;color:#0E1110">
    <p style="margin:0 0 4px;font-size:13px;font-weight:700;color:#6C7566">Services</p>
    <sc-for list="{{ services }}" as="s" hint-placeholder-count="8">
      <a href="{{ s.href }}" style="padding:14px 0;border-bottom:1px solid #D3D6D0;font-size:20px;font-weight:700;letter-spacing:-0.02em">{{ s.title }}</a>
    </sc-for>
    <div style="height:16px"></div>
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
      <a href="{{ l.href }}" style="padding:14px 0;border-bottom:1px solid #D3D6D0;font-size:20px;font-weight:700">{{ l.label }}</a>
    </sc-for>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;services&quot;,&quot;how&quot;,&quot;work&quot;,&quot;about&quot;,&quot;news&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: 1440, scrolled: false, svcMenu: false, mobile: false };
  SERVICES = [
    ['solar-pv', 'Solar PV', 'Generate clean electricity from your roof.'],
    ['battery-storage', 'Battery Storage', 'Store surplus power and use more of it.'],
    ['heat-pumps', 'Heat Pumps', 'Properly designed low-carbon heating.'],
    ['ev-chargers', 'EV Chargers', 'Smart charging for homes and fleets.'],
    ['underfloor-heating', 'Underfloor Heating', 'Even, efficient warmth.']
  ];
  componentDidMount() {
    this.onScroll = () => { const s = window.scrollY > 40; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    this.onResize = () => this.setState({ w: window.innerWidth });
    this.onKey = (e) => { if (e.key === 'Escape') this.setState({ svcMenu: false, mobile: false }); };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onResize);
    window.addEventListener('keydown', this.onKey);
    this.onResize(); this.onScroll();
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.onResize); window.removeEventListener('keydown', this.onKey);
  }
  renderVals() {
    const st = this.state, active = this.props.active || '';
    const isMobile = st.w < 1000, on = st.scrolled;
    const links = [['how', 'How It Works', 'About.dc.html#process'], ['work', 'Our Work', 'Work.dc.html'], ['about', 'About', 'About.dc.html'], ['news', 'News', 'News.dc.html']]
      .map(([k, label, href]) => ({ label, href, current: k === active ? 'page' : undefined, line: k === active ? '#0E1110' : 'transparent' }));
    return {
      isDesktop: !isMobile, isMobile, links,
      services: this.SERVICES.map(([slug, title, short]) => ({ title, short, href: 'Service.dc.html?slug=' + slug })),
      headerBg: on ? '#CBF24C' : (st.mobile ? '#F1F1EF' : 'rgba(241,241,239,0)'),
      headerLine: on ? 'rgba(14,17,16,0.12)' : 'rgba(14,17,16,0)',
      logoColorOp: on ? 0 : 1, logoInkOp: on ? 1 : 0,
      ctaBg: on ? '#0E1110' : '#FFFFFF', ctaFg: on ? '#FFFFFF' : '#0E1110', ctaDot: on ? '#CBF24C' : '#0E1110', ctaDotFg: on ? '#0E1110' : '#CBF24C',
      ctaLabel: st.w < 520 ? 'Free Consultation' : 'Get a Free Consultation',
      svcLine: active === 'services' ? '#0E1110' : 'transparent',
      svcMenuOpen: st.svcMenu && !isMobile, svcMenuExpanded: st.svcMenu ? 'true' : 'false', svcCaret: st.svcMenu ? 'rotate(180deg)' : 'none',
      openSvc: () => this.setState({ svcMenu: true }), closeSvc: () => this.setState({ svcMenu: false }), toggleSvc: () => this.setState(s => ({ svcMenu: !s.svcMenu })),
      mobileOpen: st.mobile && isMobile, mobileExpanded: st.mobile ? 'true' : 'false', toggleMobile: () => this.setState(s => ({ mobile: !s.mobile }))
    };
  }
}
</script>
</body>
</html>
